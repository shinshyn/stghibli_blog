  <body class="bg-black text-white">

            Movies

            class="bg-white text-black px-4 py-2 rounded hover:bg-gray-800"

            Form
          </a>
        </nav>
        <img
          src="/images/logo.jpeg"
          alt="Studio Ghibli Logo"
          class="max-w-full h-auto mt-6"

        <h2 class="text-2xl md:text-3xl font-sans max-w-2xl">
          Get to know Studio Ghibli movies like Spirited Away, My Neighbor
